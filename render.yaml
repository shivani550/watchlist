services:
  # 1. Express Backend Web Service with WebSockets
  - type: web
    name: watchlist-server
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm --workspace=@watchlist/shared run build && npm --workspace=@watchlist/server run build
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: watchlist-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # 2. Next.js Frontend Web Service
  - type: web
    name: watchlist-client
    env: node
    plan: free
    buildCommand: npm install && npm --workspace=@watchlist/shared run build && npm --workspace=@watchlist/client run build
    startCommand: npm --workspace=@watchlist/client run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: watchlist-server
          property: host
          value: https://${host}/api

databases:
  # Managed PostgreSQL Database
  - name: watchlist-db
    plan: free
    databaseName: watchlist_db
    user: postgres
